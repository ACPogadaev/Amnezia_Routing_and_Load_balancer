name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests and release rendering
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: find templates -name '*.sh' -print0 | xargs -0 -n 1 bash -n
      - name: Isolated kernel integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 iptables nftables
          sudo env AMNEZIA_LB_INTEGRATION=1 "$(command -v python)" -m unittest discover -s tests -p test_linux_runtime.py -v
