services:
  egress-main:
    image: amnezia-awg2
    container_name: ${EGRESS_CONTAINER}
    entrypoint:
      - dumb-init
      - /bin/bash
      - /run/amnezia-lb-v2/egress-start.sh
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      # Forwarding starts disabled. After egress-start publishes policy
      # readiness, a PID-checked host helper enables this namespaced sysctl.
      net.ipv4.ip_forward: "0"
      net.ipv4.conf.all.rp_filter: "2"
      net.ipv4.conf.default.rp_filter: "2"
    environment:
      EGRESS_AWG_IF: ${EGRESS_AWG_IF}
      EGRESS_AWG_IP: ${EGRESS_AWG_IP}
      EGRESS_AWG_ENDPOINT_IP: ${EGRESS_AWG_ENDPOINT_IP}
      EGRESS_AWG_ENDPOINT_PORT: ${EGRESS_AWG_ENDPOINT_PORT}
      TRANSIT_GATEWAY: ${TRANSIT_GATEWAY}
      EGRESS_POLICY_TABLE: ${EGRESS_POLICY_TABLE}
      INGRESS_TRANSIT_IP: ${INGRESS_TRANSIT_IP}
      EGRESS_START_DELAY_SECONDS: ${EGRESS_START_DELAY_SECONDS}
      EGRESS_READY_FILE: /run/amnezia-lb-v2/egress-policy-ready
      EGRESS_EXPECTED_EXIT_IP: ${EXPECTED_EXIT_IP}
      HEALTH_URL: ${HEALTH_URL}
      HEALTH_URL_SECONDARY: ${HEALTH_URL_SECONDARY}
      HEALTH_MAX_HANDSHAKE_AGE_SECONDS: ${HEALTH_MAX_HANDSHAKE_AGE_SECONDS}
      HEALTH_PROBE_TIMEOUT_SECONDS: ${HEALTH_PROBE_TIMEOUT_SECONDS}
      HEALTH_CONNECT_TIMEOUT_SECONDS: ${HEALTH_CONNECT_TIMEOUT_SECONDS}
      HEALTH_HTTP_TIMEOUT_SECONDS: ${HEALTH_HTTP_TIMEOUT_SECONDS}
      HEALTH_CONFIG_GENERATION: ${HEALTH_CONFIG_GENERATION}
      HEALTH_MAX_SAMPLE_AGE_SECONDS: ${HEALTH_MAX_SAMPLE_AGE_SECONDS}
    healthcheck:
      test:
        - CMD-SHELL
        - timeout ${HEALTH_PROBE_TIMEOUT_SECONDS}s /run/amnezia-lb-health/egress-healthcheck.sh --docker
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    volumes:
      - /opt/amnezia-lb-v2/secrets/awg-main.conf:/etc/amnezia/amneziawg/awg-main.conf:ro
      - /etc/amnezia-lb-v2/egress/egress-start.sh:/run/amnezia-lb-v2/egress-start.sh:ro
      - /etc/amnezia-lb-v2/egress/egress-healthcheck.sh:/run/amnezia-lb-health/egress-healthcheck.sh:ro
    networks:
      transit:
        ipv4_address: ${EGRESS_CONTAINER_IP}

networks:
  transit:
    external: true
    name: ${TRANSIT_NETWORK}
